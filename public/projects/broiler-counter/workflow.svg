<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" width="1100" height="620" font-family="'Segoe UI', 'Inter', monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="100%" stop-color="#131c33"/>
    </linearGradient>
    <linearGradient id="uiGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="vmGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#172554"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="mlGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <linearGradient id="dbGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3b0764"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#22c55e"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1100" height="620" rx="16" fill="url(#bg)" stroke="#334155" stroke-width="2"/>

  <!-- Header -->
  <rect x="24" y="20" width="1052" height="58" rx="10" fill="#0f172a" stroke="#22c55e" stroke-width="1.5"/>
  <text x="48" y="46" fill="#22c55e" font-size="18" font-weight="800" letter-spacing="1">🐔 CHICKOUNT — ANDROID MVVM + YOLOv8s TFLITE ARCHITECTURE</text>
  <text x="48" y="66" fill="#94a3b8" font-size="12">Kotlin 2.2 • Jetpack Compose (Material 3) • CameraX 1.4.1 • TensorFlow Lite 2.17.0 (XNNPACK) • Room SQLite 2.8.5</text>

  <!-- LAYER 1: UI LAYER (JETPACK COMPOSE) -->
  <rect x="24" y="96" width="1052" height="145" rx="12" fill="url(#uiGrad)" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="44" y="120" fill="#38bdf8" font-size="13" font-weight="700">1. UI LAYER — JETPACK COMPOSE &amp; NAVIGATION COMPOSE</text>

  <!-- UI Screens -->
  <rect x="44" y="132" width="225" height="92" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="58" y="154" fill="#f8fafc" font-size="13" font-weight="700">🏠 HomeScreen (Home.kt)</text>
  <text x="58" y="174" fill="#94a3b8" font-size="11">• Hero Card Pindai Cepat</text>
  <text x="58" y="191" fill="#94a3b8" font-size="11">• Metrik Hari Ini, Total &amp; Rata-rata</text>
  <text x="58" y="208" fill="#94a3b8" font-size="11">• Daftar Pindaian Terakhir</text>

  <rect x="288" y="132" width="260" height="92" rx="8" fill="#0f172a" stroke="#22c55e" stroke-width="1.5"/>
  <text x="302" y="154" fill="#22c55e" font-size="13" font-weight="700">📷 ScanScreen (ScanScreen.kt)</text>
  <text x="302" y="174" fill="#94a3b8" font-size="11">• CameraX Live Preview &amp; Static Capture</text>
  <text x="302" y="191" fill="#94a3b8" font-size="11">• Dynamic Bounding Box Overlay</text>
  <text x="302" y="208" fill="#94a3b8" font-size="11">• Confidence Threshold (-5% / +5%)</text>

  <rect x="568" y="132" width="245" height="92" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="582" y="154" fill="#f8fafc" font-size="13" font-weight="700">📊 HistoryScreen.kt</text>
  <text x="582" y="174" fill="#94a3b8" font-size="11">• Grafik Mingguan 7 Hari (Sen–Min)</text>
  <text x="582" y="191" fill="#94a3b8" font-size="11">• Filter: Hari Ini / Minggu Ini / Semua</text>
  <text x="582" y="208" fill="#94a3b8" font-size="11">• Sortir: Terbaru &amp; Terlama</text>

  <rect x="832" y="132" width="224" height="92" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="846" y="154" fill="#f8fafc" font-size="13" font-weight="700">🔍 DetailHistoryScreen.kt</text>
  <text x="846" y="174" fill="#94a3b8" font-size="11">• Foto Anotasi Resolusi Tinggi</text>
  <text x="846" y="191" fill="#94a3b8" font-size="11">• Fitur Bagikan Laporan (Share)</text>
  <text x="846" y="208" fill="#94a3b8" font-size="11">• Hapus Sesi &amp; Sinkronisasi</text>

  <!-- LAYER 2: VIEWMODEL LAYER -->
  <rect x="24" y="268" width="1052" height="118" rx="12" fill="url(#vmGrad)" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="44" y="292" fill="#f59e0b" font-size="13" font-weight="700">2. VIEWMODEL LAYER — REACTIVE STATE MANAGEMENT (KOTLIN COROUTINES &amp; STATEFLOW)</text>

  <rect x="120" y="304" width="380" height="68" rx="8" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="140" y="327" fill="#fbbf24" font-size="14" font-weight="700">⚡ ScanViewModel (StateFlow)</text>
  <text x="140" y="346" fill="#cbd5e1" font-size="11">Mengelola state frame kamera, threshold sensitivitas,</text>
  <text x="140" y="362" fill="#cbd5e1" font-size="11">daftar deteksi bounding box, &amp; trigger simpan hasil pindaian.</text>

  <rect x="590" y="304" width="390" height="68" rx="8" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="610" y="327" fill="#fbbf24" font-size="14" font-weight="700">🗂️ HistoryViewModel (StateFlow)</text>
  <text x="610" y="346" fill="#cbd5e1" font-size="11">Mengelola agregasi statistik harian/mingguan, filter waktu,</text>
  <text x="610" y="362" fill="#cbd5e1" font-size="11">pengurutan sesi, serta auto-sync pemulihan foto lokal.</text>

  <!-- LAYER 3: DATA & ML INFERENCE LAYER -->
  <rect x="24" y="414" width="1052" height="182" rx="12" fill="#090d16" stroke="#22c55e" stroke-width="1.5"/>
  <text x="44" y="438" fill="#22c55e" font-size="13" font-weight="700">3. ON-DEVICE AI ENGINE &amp; LOCAL PERSISTENCE LAYER</text>

  <!-- YOLOv8 Box -->
  <rect x="44" y="452" width="460" height="126" rx="10" fill="url(#mlGrad)" stroke="#22c55e" stroke-width="2"/>
  <text x="64" y="476" fill="#4ade80" font-size="14" font-weight="800">🧠 ChickenDetection (YOLOv8 best_small.tflite)</text>
  <text x="64" y="497" fill="#e2e8f0" font-size="11.5">1. Preprocessing: Resize &amp; normalisasi piksel ke tensor NCHW [1, 3, 640, 640]</text>
  <text x="64" y="516" fill="#e2e8f0" font-size="11.5">2. TFLite 2.17.0 CPU Multi-Thread Inference via XNNPACK SIMD</text>
  <text x="64" y="535" fill="#e2e8f0" font-size="11.5">3. Post-Processing: Filter Confidence Threshold + Non-Maximum Suppression (NMS)</text>
  <text x="64" y="554" fill="#86efac" font-size="11.5" font-weight="700">4. Output: Koordinat Bounding Box [x,y,w,h], Skor Confidence &amp; Total Ayam</text>

  <!-- Repository & Room SQLite Box -->
  <rect x="528" y="452" width="265" height="126" rx="10" fill="url(#dbGrad)" stroke="#a855f7" stroke-width="1.5"/>
  <text x="546" y="476" fill="#d8b4fe" font-size="13.5" font-weight="800">🗄️ Room SQLite (v2.8.5)</text>
  <text x="546" y="497" fill="#e2e8f0" font-size="11">• HistoryRepository</text>
  <text x="546" y="516" fill="#e2e8f0" font-size="11">• AppDatabase &amp; ScanResultDao</text>
  <text x="546" y="535" fill="#e2e8f0" font-size="11">• Menyimpan jumlah ayam, timestamp,</text>
  <text x="546" y="552" fill="#e2e8f0" font-size="11">  mode pindai &amp; path file gambar</text>

  <!-- ImageStorageHelper Box -->
  <rect x="812" y="452" width="244" height="126" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="830" y="476" fill="#38bdf8" font-size="13.5" font-weight="800">🖼️ ImageStorageHelper</text>
  <text x="830" y="497" fill="#e2e8f0" font-size="11">• Merender kotak deteksi &amp; label</text>
  <text x="830" y="514" fill="#e2e8f0" font-size="11">  ke bitmap (filesDir/scans/*.jpg)</text>
  <text x="830" y="533" fill="#e2e8f0" font-size="11">• syncAndRestoreLocalScans()</text>
  <text x="830" y="550" fill="#94a3b8" font-size="11">  pemulihan otomatis data lokal</text>

  <!-- Arrows -->
  <line x1="418" y1="224" x2="310" y2="304" stroke="#22c55e" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <line x1="156" y1="224" x2="680" y2="304" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <line x1="690" y1="224" x2="750" y2="304" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <line x1="944" y1="224" x2="860" y2="304" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowBlue)"/>

  <line x1="274" y1="372" x2="274" y2="452" stroke="#22c55e" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
  <line x1="380" y1="372" x2="640" y2="452" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrowAmber)"/>
  <line x1="440" y1="372" x2="900" y2="452" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <line x1="740" y1="372" x2="680" y2="452" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrowAmber)"/>
  <line x1="840" y1="372" x2="934" y2="452" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowBlue)"/>
</svg>
