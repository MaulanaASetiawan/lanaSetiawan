<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" width="900" height="450">
  <rect width="900" height="450" fill="#0d1117"/>
  <rect x="14" y="14" width="872" height="422" fill="#161b22" stroke="#22c55e" stroke-width="4"/>
  <text x="38" y="52" fill="#22c55e" font-family="monospace" font-weight="bold" font-size="20">CARA KERJA APLIKASI PENGHITUNG AYAM BROILER (JETPACK COMPOSE + YOLOv8s)</text>

  <rect x="38" y="95" width="195" height="210" fill="#1c2333" stroke="#38bdf8" stroke-width="3"/>
  <text x="54" y="128" fill="#38bdf8" font-family="monospace" font-weight="bold" font-size="14">1. CITRA KANDANG</text>
  <text x="54" y="158" fill="#e6edf3" font-family="monospace" font-size="12">• Ambil foto/frame</text>
  <text x="54" y="178" fill="#e6edf3" font-family="monospace" font-size="12">  ayam broiler dari</text>
  <text x="54" y="198" fill="#e6edf3" font-family="monospace" font-size="12">  kamera / galeri</text>
  <text x="54" y="228" fill="#94a3b8" font-family="monospace" font-size="12">• Preprocessing</text>
  <text x="54" y="248" fill="#94a3b8" font-family="monospace" font-size="12">  ukuran tensor</text>

  <rect x="253" y="95" width="195" height="210" fill="#1c2333" stroke="#f97316" stroke-width="3"/>
  <text x="269" y="128" fill="#f97316" font-family="monospace" font-weight="bold" font-size="14">2. YOLOv8s MODEL</text>
  <text x="269" y="158" fill="#e6edf3" font-family="monospace" font-size="12">• Inferensi objek</text>
  <text x="269" y="178" fill="#e6edf3" font-family="monospace" font-size="12">  dengan YOLOv8-Small</text>
  <text x="269" y="208" fill="#e6edf3" font-family="monospace" font-size="12">• Non-Maximum</text>
  <text x="269" y="228" fill="#e6edf3" font-family="monospace" font-size="12">  Suppression (NMS)</text>
  <text x="269" y="256" fill="#f97316" font-family="monospace" font-size="12">• Akurasi tinggi</text>

  <rect x="468" y="95" width="195" height="210" fill="#1c2333" stroke="#22c55e" stroke-width="3"/>
  <text x="484" y="128" fill="#22c55e" font-family="monospace" font-weight="bold" font-size="14">3. MVVM LAYER</text>
  <text x="484" y="158" fill="#e6edf3" font-family="monospace" font-size="12">• Repository &amp;</text>
  <text x="484" y="178" fill="#e6edf3" font-family="monospace" font-size="12">  ViewModel mengelola</text>
  <text x="484" y="198" fill="#e6edf3" font-family="monospace" font-size="12">  state deteksi</text>
  <text x="484" y="228" fill="#22c55e" font-family="monospace" font-size="12">• Unidirectional</text>
  <text x="484" y="248" fill="#22c55e" font-family="monospace" font-size="12">  Data Flow (UDF)</text>

  <rect x="683" y="95" width="179" height="210" fill="#1c2333" stroke="#a78bfa" stroke-width="3"/>
  <text x="699" y="128" fill="#a78bfa" font-family="monospace" font-weight="bold" font-size="14">4. COMPOSE UI</text>
  <text x="699" y="158" fill="#e6edf3" font-family="monospace" font-size="12">• Render Canvas</text>
  <text x="699" y="178" fill="#e6edf3" font-family="monospace" font-size="12">  Bounding Box</text>
  <text x="699" y="206" fill="#e6edf3" font-family="monospace" font-size="12">• Hitung total</text>
  <text x="699" y="226" fill="#e6edf3" font-family="monospace" font-size="12">  ayam otomatis</text>
  <text x="699" y="254" fill="#38bdf8" font-family="monospace" font-size="12">• Simpan Riwayat</text>

  <rect x="38" y="330" width="824" height="80" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
  <text x="58" y="362" fill="#e6edf3" font-family="monospace" font-size="14">Memudahkan peternak menghitung populasi ayam broiler secara cepat dan objektif melalui kamera</text>
  <text x="58" y="386" fill="#22c55e" font-family="monospace" font-size="14">smartphone Android tanpa harus menghitung manual satu per satu di dalam kandang.</text>
</svg>
