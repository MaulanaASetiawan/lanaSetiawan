<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" width="900" height="450">
  <rect width="900" height="450" fill="#0d1117"/>
  <rect x="14" y="14" width="872" height="422" fill="#161b22" stroke="#a78bfa" stroke-width="4"/>
  <text x="38" y="52" fill="#a78bfa" font-family="monospace" font-weight="bold" font-size="20">ALUR KERJA PIPELINE MLOps (TFX + DOCKER + PROMETHEUS/GRAFANA)</text>

  <!-- Step 1 -->
  <rect x="38" y="95" width="190" height="210" fill="#1c2333" stroke="#38bdf8" stroke-width="3"/>
  <text x="54" y="128" fill="#38bdf8" font-family="monospace" font-weight="bold" font-size="15">1. DATA INGESTION</text>
  <text x="54" y="160" fill="#e6edf3" font-family="monospace" font-size="12">• Dataset Twitter Kaggle</text>
  <text x="54" y="185" fill="#e6edf3" font-family="monospace" font-size="12">• ExampleGen</text>
  <text x="54" y="210" fill="#e6edf3" font-family="monospace" font-size="12">• StatisticsGen</text>
  <text x="54" y="235" fill="#e6edf3" font-family="monospace" font-size="12">• SchemaGen &amp;</text>
  <text x="54" y="255" fill="#e6edf3" font-family="monospace" font-size="12">  ExampleValidator</text>

  <!-- Step 2 -->
  <rect x="252" y="95" width="190" height="210" fill="#1c2333" stroke="#f97316" stroke-width="3"/>
  <text x="268" y="128" fill="#f97316" font-family="monospace" font-weight="bold" font-size="15">2. NLP &amp; TRAINING</text>
  <text x="268" y="160" fill="#e6edf3" font-family="monospace" font-size="12">• TFX Transform</text>
  <text x="268" y="185" fill="#e6edf3" font-family="monospace" font-size="12">  (Tokenization/Pad)</text>
  <text x="268" y="210" fill="#e6edf3" font-family="monospace" font-size="12">• Hyperparameter</text>
  <text x="268" y="230" fill="#e6edf3" font-family="monospace" font-size="12">  Tuning (Tuner)</text>
  <text x="268" y="255" fill="#e6edf3" font-family="monospace" font-size="12">• Deep Learning</text>
  <text x="268" y="275" fill="#e6edf3" font-family="monospace" font-size="12">  Model Trainer</text>

  <!-- Step 3 -->
  <rect x="466" y="95" width="190" height="210" fill="#1c2333" stroke="#22c55e" stroke-width="3"/>
  <text x="482" y="128" fill="#22c55e" font-family="monospace" font-weight="bold" font-size="15">3. EVALUATION</text>
  <text x="482" y="160" fill="#e6edf3" font-family="monospace" font-size="12">• TFMA Evaluator</text>
  <text x="482" y="185" fill="#e6edf3" font-family="monospace" font-size="12">• AUC / Binary</text>
  <text x="482" y="205" fill="#e6edf3" font-family="monospace" font-size="12">  Accuracy Threshold</text>
  <text x="482" y="235" fill="#e6edf3" font-family="monospace" font-size="12">• Pusher hanya</text>
  <text x="482" y="255" fill="#22c55e" font-family="monospace" font-size="12">  deploy model</text>
  <text x="482" y="275" fill="#22c55e" font-family="monospace" font-size="12">  yang lolos</text>

  <!-- Step 4 -->
  <rect x="680" y="95" width="182" height="210" fill="#1c2333" stroke="#a78bfa" stroke-width="3"/>
  <text x="696" y="128" fill="#a78bfa" font-family="monospace" font-weight="bold" font-size="15">4. MONITORING</text>
  <text x="696" y="160" fill="#e6edf3" font-family="monospace" font-size="12">• TF Serving</text>
  <text x="696" y="180" fill="#e6edf3" font-family="monospace" font-size="12">  di Docker</text>
  <text x="696" y="210" fill="#e6edf3" font-family="monospace" font-size="12">• Prometheus</text>
  <text x="696" y="235" fill="#e6edf3" font-family="monospace" font-size="12">• Dashboard</text>
  <text x="696" y="255" fill="#a78bfa" font-family="monospace" font-size="12">  Grafana</text>

  <rect x="38" y="334" width="824" height="76" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
  <text x="58" y="366" fill="#e6edf3" font-family="monospace" font-size="14">Menjamin konsistensi preprocessing antara fase Training dan Serving (mencegah Training-Serving Skew)</text>
  <text x="58" y="390" fill="#22c55e" font-family="monospace" font-size="14">serta memantau kesehatan request inferensi secara real-time melalui Prometheus &amp; Grafana.</text>
</svg>
