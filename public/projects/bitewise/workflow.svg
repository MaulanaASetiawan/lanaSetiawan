<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 470" width="920" height="470">
  <rect width="920" height="470" fill="#0d1117"/>
  <rect x="14" y="14" width="892" height="442" fill="#161b22" stroke="#22c55e" stroke-width="4"/>
  <rect x="14" y="14" width="892" height="46" fill="#1c2333" stroke="#22c55e" stroke-width="2"/>
  <text x="36" y="43" fill="#22c55e" font-family="monospace" font-weight="bold" font-size="18">📱 ARSITEKTUR ANDROID BITEWISE (KOTLIN MVVM + CAMERAX + CLOUD ML API)</text>

  <!-- Step 1: UI Layer -->
  <rect x="36" y="84" width="198" height="225" fill="#1c2333" stroke="#38bdf8" stroke-width="3"/>
  <text x="52" y="114" fill="#38bdf8" font-family="monospace" font-weight="bold" font-size="14">1. UI &amp; MEDIA LAYER</text>
  <text x="52" y="144" fill="#e6edf3" font-family="monospace" font-size="12">• Activities &amp; Fragments</text>
  <text x="52" y="166" fill="#e6edf3" font-family="monospace" font-size="12">• ViewBinding &amp; Nav</text>
  <text x="52" y="192" fill="#22c55e" font-family="monospace" font-weight="bold" font-size="12">• CameraX + uCrop</text>
  <text x="52" y="212" fill="#94a3b8" font-family="monospace" font-size="11">  (Scan Tabel Gizi)</text>
  <text x="52" y="240" fill="#e6edf3" font-family="monospace" font-size="12">• Glide Image Loader</text>
  <text x="52" y="264" fill="#e6edf3" font-family="monospace" font-size="12">• Custom Gauge Meters</text>
  <text x="52" y="284" fill="#94a3b8" font-family="monospace" font-size="11">  (Kalori/BMI/Tensi)</text>

  <!-- Arrow 1 -> 2 -->
  <path d="M234 196 L256 196" stroke="#f97316" stroke-width="3"/>
  <polygon points="252,190 262,196 252,202" fill="#f97316"/>

  <!-- Step 2: MVVM & Local Persistence -->
  <rect x="262" y="84" width="198" height="225" fill="#1c2333" stroke="#f97316" stroke-width="3"/>
  <text x="278" y="114" fill="#f97316" font-family="monospace" font-weight="bold" font-size="14">2. MVVM &amp; DATASTORE</text>
  <text x="278" y="144" fill="#e6edf3" font-family="monospace" font-size="12">• ViewModel &amp; LiveData</text>
  <text x="278" y="166" fill="#e6edf3" font-family="monospace" font-size="12">  (Reactive UI State)</text>
  <text x="278" y="194" fill="#f97316" font-family="monospace" font-weight="bold" font-size="12">• Jetpack DataStore</text>
  <text x="278" y="214" fill="#94a3b8" font-family="monospace" font-size="11">  (Session Token &amp;</text>
  <text x="278" y="232" fill="#94a3b8" font-family="monospace" font-size="11">   Dark/Light Theme)</text>
  <text x="278" y="260" fill="#e6edf3" font-family="monospace" font-size="12">• Repository Pattern</text>
  <text x="278" y="282" fill="#e6edf3" font-family="monospace" font-size="12">  (Single Source Data)</text>

  <!-- Arrow 2 -> 3 -->
  <path d="M460 196 L482 196" stroke="#f97316" stroke-width="3"/>
  <polygon points="478,190 488,196 478,202" fill="#f97316"/>

  <!-- Step 3: Network Layer -->
  <rect x="488" y="84" width="190" height="225" fill="#1c2333" stroke="#22c55e" stroke-width="3"/>
  <text x="504" y="114" fill="#22c55e" font-family="monospace" font-weight="bold" font-size="14">3. RETROFIT2 CLIENT</text>
  <text x="504" y="144" fill="#e6edf3" font-family="monospace" font-size="12">• Retrofit2 + Gson</text>
  <text x="504" y="166" fill="#e6edf3" font-family="monospace" font-size="12">• OkHttp Logging</text>
  <text x="504" y="194" fill="#22c55e" font-family="monospace" font-weight="bold" font-size="12">• Multipart Upload</text>
  <text x="504" y="214" fill="#94a3b8" font-family="monospace" font-size="11">  (Foto Nilai Gizi &amp;</text>
  <text x="504" y="232" fill="#94a3b8" font-family="monospace" font-size="11">   Postingan Komunitas)</text>
  <text x="504" y="260" fill="#e6edf3" font-family="monospace" font-size="12">• REST API Sync</text>
  <text x="504" y="282" fill="#94a3b8" font-family="monospace" font-size="11">  (GCP App Engine)</text>

  <!-- Arrow 3 -> 4 -->
  <path d="M678 196 L700 196" stroke="#f97316" stroke-width="3"/>
  <polygon points="696,190 706,196 696,202" fill="#f97316"/>

  <!-- Step 4: Cloud & ML Backend -->
  <rect x="706" y="84" width="178" height="225" fill="#1c2333" stroke="#a78bfa" stroke-width="3"/>
  <text x="720" y="114" fill="#a78bfa" font-family="monospace" font-weight="bold" font-size="14">4. CLOUD &amp; ML</text>
  <text x="720" y="144" fill="#e6edf3" font-family="monospace" font-size="12">• OCR &amp; Analisis</text>
  <text x="720" y="164" fill="#e6edf3" font-family="monospace" font-size="12">  Tabel Nilai Gizi</text>
  <text x="720" y="192" fill="#a78bfa" font-family="monospace" font-weight="bold" font-size="12">• Klasifikasi Risiko</text>
  <text x="720" y="212" fill="#22c55e" font-family="monospace" font-size="11">  (LOW / MED / HIGH)</text>
  <text x="720" y="240" fill="#e6edf3" font-family="monospace" font-size="12">• Rekomendasi</text>
  <text x="720" y="260" fill="#e6edf3" font-family="monospace" font-size="12">  Makanan Sehat</text>
  <text x="720" y="282" fill="#38bdf8" font-family="monospace" font-size="11">• Firebase / Cloud</text>

  <!-- Bottom Role Highlight Box -->
  <rect x="36" y="332" width="848" height="100" fill="#0d1117" stroke="#f97316" stroke-width="2"/>
  <text x="56" y="362" fill="#f97316" font-family="monospace" font-weight="bold" font-size="15">PERAN MAULANA (MOBILE DEVELOPMENT — BANGKIT ACADEMY CAPSTONE):</text>
  <text x="56" y="388" fill="#e6edf3" font-family="monospace" font-size="13">• Membangun seluruh antarmuka Android (Onboarding, Scanner Gizi, Dashboard 4-Gauge BMI/Kalori/Tensi, Feed Komunitas)</text>
  <text x="56" y="410" fill="#22c55e" font-family="monospace" font-size="13">• Mengimplementasikan arsitektur MVVM, CameraX + uCrop, Retrofit2 REST API, serta fitur Dual-Theme (Light/Dark Mode).</text>
</svg>
