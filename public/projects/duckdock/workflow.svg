<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" width="900" height="450">
  <rect width="900" height="450" fill="#0d1117"/>
  <rect x="14" y="14" width="872" height="422" fill="#161b22" stroke="#f97316" stroke-width="4"/>
  <text x="38" y="52" fill="#f97316" font-family="monospace" font-weight="bold" font-size="20">CARA KERJA DUCKDOCK (ESP32 + OLED SSD1306 + 10 BUTTONS)</text>

  <rect x="40" y="96" width="250" height="205" fill="#1c2333" stroke="#38bdf8" stroke-width="3"/>
  <text x="58" y="130" fill="#38bdf8" font-family="monospace" font-weight="bold" font-size="15">1. 10-BUTTON INPUT</text>
  <text x="58" y="162" fill="#e6edf3" font-family="monospace" font-size="13">• 10 Tombol Fisik</text>
  <text x="58" y="184" fill="#e6edf3" font-family="monospace" font-size="13">  terhubung ke GPIO</text>
  <text x="58" y="212" fill="#e6edf3" font-family="monospace" font-size="13">• Software Debounce</text>
  <text x="58" y="234" fill="#e6edf3" font-family="monospace" font-size="13">  &amp; Deteksi Tekan</text>
  <text x="58" y="256" fill="#22c55e" font-family="monospace" font-size="12">  Singkat / Tahan</text>

  <rect x="325" y="96" width="250" height="205" fill="#1c2333" stroke="#f97316" stroke-width="3"/>
  <text x="343" y="130" fill="#f97316" font-family="monospace" font-weight="bold" font-size="15">2. ESP32 &amp; SSD1306</text>
  <text x="343" y="162" fill="#e6edf3" font-family="monospace" font-size="13">• Mikrokontroler</text>
  <text x="343" y="184" fill="#e6edf3" font-family="monospace" font-size="13">  memetakan Keymap</text>
  <text x="343" y="212" fill="#e6edf3" font-family="monospace" font-size="13">• Layar OLED SSD1306</text>
  <text x="343" y="234" fill="#e6edf3" font-family="monospace" font-size="13">  menampilkan profil</text>
  <text x="343" y="256" fill="#38bdf8" font-family="monospace" font-size="12">  &amp; aksi aktif via I2C</text>

  <rect x="610" y="96" width="250" height="205" fill="#1c2333" stroke="#22c55e" stroke-width="3"/>
  <text x="628" y="130" fill="#22c55e" font-family="monospace" font-weight="bold" font-size="15">3. HID / MACRO EXEC</text>
  <text x="628" y="162" fill="#e6edf3" font-family="monospace" font-size="13">• Mengirim kombinasi</text>
  <text x="628" y="184" fill="#e6edf3" font-family="monospace" font-size="13">  keystroke/hotkey</text>
  <text x="628" y="206" fill="#e6edf3" font-family="monospace" font-size="13">  ke PC / Laptop</text>
  <text x="628" y="234" fill="#22c55e" font-family="monospace" font-size="12">• Kontrol OBS, Media,</text>
  <text x="628" y="256" fill="#22c55e" font-family="monospace" font-size="12">  &amp; Shortcut Coding</text>

  <rect x="40" y="330" width="820" height="76" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
  <text x="60" y="362" fill="#e6edf3" font-family="monospace" font-size="14">Alternatif Stream Deck hemat biaya berbasis ESP32 dengan umpan balik visual real-time pada</text>
  <text x="60" y="386" fill="#f97316" font-family="monospace" font-size="14">layar OLED SSD1306 serta 10 tombol kustom yang responsif.</text>
</svg>
