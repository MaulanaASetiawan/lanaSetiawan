<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500">
  <rect width="900" height="500" fill="#0d1117"/>
  <rect x="16" y="16" width="868" height="468" fill="#161b22" stroke="#38bdf8" stroke-width="4"/>
  <rect x="16" y="16" width="868" height="46" fill="#1c2333" stroke="#38bdf8" stroke-width="2"/>
  <text x="38" y="45" fill="#38bdf8" font-family="monospace" font-weight="bold" font-size="18">🔌 DUCKDOCK HARDWARE PINOUT &amp; ARCHITECTURE (ESP32 + SSD1306 + 10 BUTTONS)</text>

  <!-- Left Column: 6 Custom Shortcut Buttons -->
  <rect x="40" y="86" width="250" height="295" fill="#1c2333" stroke="#f97316" stroke-width="3"/>
  <text x="58" y="116" fill="#f97316" font-family="monospace" font-weight="bold" font-size="15">6 SLOT TOMBOL MAKRO</text>
  <text x="58" y="136" fill="#94a3b8" font-family="monospace" font-size="12">Remappable via OLED Menu</text>

  <g font-family="monospace" font-size="13" fill="#e6edf3">
    <rect x="58" y="152" width="214" height="30" fill="#0d1117" stroke="#30363d"/>
    <text x="68" y="172">Slot 1 (btnS[0]) → <tspan fill="#f97316" font-weight="bold">GPIO 32</tspan></text>

    <rect x="58" y="188" width="214" height="30" fill="#0d1117" stroke="#30363d"/>
    <text x="68" y="208">Slot 2 (btnS[1]) → <tspan fill="#f97316" font-weight="bold">GPIO 33</tspan></text>

    <rect x="58" y="224" width="214" height="30" fill="#0d1117" stroke="#30363d"/>
    <text x="68" y="244">Slot 3 (btnS[2]) → <tspan fill="#f97316" font-weight="bold">GPIO 25</tspan></text>

    <rect x="58" y="260" width="214" height="30" fill="#0d1117" stroke="#30363d"/>
    <text x="68" y="280">Slot 4 (btnS[3]) → <tspan fill="#f97316" font-weight="bold">GPIO 26</tspan></text>

    <rect x="58" y="296" width="214" height="30" fill="#0d1117" stroke="#30363d"/>
    <text x="68" y="316">Slot 5 (btnS[4]) → <tspan fill="#f97316" font-weight="bold">GPIO 27</tspan></text>

    <rect x="58" y="332" width="214" height="30" fill="#0d1117" stroke="#30363d"/>
    <text x="68" y="352">Slot 6 (btnS[5]) → <tspan fill="#f97316" font-weight="bold">GPIO 14</tspan></text>
  </g>

  <!-- Center Column: ESP32 Core -->
  <rect x="325" y="86" width="250" height="295" fill="#0d1117" stroke="#22c55e" stroke-width="3"/>
  <text x="360" y="120" fill="#22c55e" font-family="monospace" font-weight="bold" font-size="17">ESP32 DEV MODULE</text>
  <text x="352" y="144" fill="#38bdf8" font-family="monospace" font-size="12">BLE HID: "StreamDock ESP32"</text>

  <rect x="345" y="164" width="210" height="90" fill="#1c2333" stroke="#38bdf8" stroke-width="2"/>
  <text x="358" y="188" fill="#38bdf8" font-family="monospace" font-weight="bold" font-size="13">NVS FLASH (Preferences.h)</text>
  <text x="358" y="210" fill="#e6edf3" font-family="monospace" font-size="12">• Namespace: "streamdock"</text>
  <text x="358" y="230" fill="#e6edf3" font-family="monospace" font-size="12">• Keys: slot0 .. slot5</text>
  <text x="358" y="246" fill="#22c55e" font-family="monospace" font-size="11">• Anti-Reset saat Mati Daya</text>

  <rect x="345" y="270" width="210" height="92" fill="#1c2333" stroke="#f97316" stroke-width="2"/>
  <text x="358" y="294" fill="#f97316" font-family="monospace" font-weight="bold" font-size="13">DEBOUNCE &amp; INPUT LOGIC</text>
  <text x="358" y="316" fill="#e6edf3" font-family="monospace" font-size="12">• Mode: INPUT_PULLUP</text>
  <text x="358" y="336" fill="#e6edf3" font-family="monospace" font-size="12">• Validasi Tekan: 30ms</text>
  <text x="358" y="352" fill="#e6edf3" font-family="monospace" font-size="12">• Release Lock Guard</text>

  <!-- Right Column: OLED I2C & 4 Nav/Media Buttons -->
  <rect x="610" y="86" width="250" height="125" fill="#1c2333" stroke="#38bdf8" stroke-width="3"/>
  <text x="628" y="114" fill="#38bdf8" font-family="monospace" font-weight="bold" font-size="15">OLED SSD1306 (128x64)</text>
  <text x="628" y="140" fill="#e6edf3" font-family="monospace" font-size="13">• I2C SDA → <tspan fill="#38bdf8" font-weight="bold">GPIO 21</tspan></text>
  <text x="628" y="162" fill="#e6edf3" font-family="monospace" font-size="13">• I2C SCL → <tspan fill="#38bdf8" font-weight="bold">GPIO 22</tspan></text>
  <text x="628" y="184" fill="#e6edf3" font-family="monospace" font-size="13">• Address → <tspan fill="#22c55e" font-weight="bold">0x3C (100kHz)</tspan></text>

  <rect x="610" y="226" width="250" height="155" fill="#1c2333" stroke="#a78bfa" stroke-width="3"/>
  <text x="628" y="252" fill="#a78bfa" font-family="monospace" font-weight="bold" font-size="14">4 TOMBOL NAV &amp; MEDIA</text>
  <text x="628" y="278" fill="#e6edf3" font-family="monospace" font-size="12">• btnMenu  → <tspan fill="#a78bfa" font-weight="bold">GPIO 4</tspan> (Menu)</text>
  <text x="628" y="302" fill="#e6edf3" font-family="monospace" font-size="12">• btnEnter → <tspan fill="#a78bfa" font-weight="bold">GPIO 5</tspan> (OK / Play)</text>
  <text x="628" y="326" fill="#e6edf3" font-family="monospace" font-size="12">• btnDown  → <tspan fill="#a78bfa" font-weight="bold">GPIO 18</tspan> (Down/Vol-)</text>
  <text x="628" y="350" fill="#e6edf3" font-family="monospace" font-size="12">• btnUp    → <tspan fill="#a78bfa" font-weight="bold">GPIO 19</tspan> (Up / Vol+)</text>

  <!-- Bottom Banner -->
  <rect x="40" y="404" width="820" height="56" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
  <text x="60" y="437" fill="#e6edf3" font-family="monospace" font-size="14">Semua tombol menggunakan internal Pull-Up Resistor (aktif LOW saat ditekan ke GND) tanpa perlu resistor eksternal.</text>
</svg>
