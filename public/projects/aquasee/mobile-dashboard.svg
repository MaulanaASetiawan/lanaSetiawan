      <!-- Section: Output Devices Status -->
      <text x="22" y="238" fill="#0f172a" font-size="15" font-weight="700">Output Devices Status</text>

      <!-- Grid 2x2: 4 Output Devices -->
      <!-- Card 1: Pompa pH Up -->
      <g filter="url(#cardShadow)">
        <rect x="20" y="254" width="145" height="106" rx="16" fill="#ffffff"/>
      </g>
      <!-- Orange Glowing Up Triangle -->
