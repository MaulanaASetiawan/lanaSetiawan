        <path d="M 17 11 L 23 5 L 20 5 L 20 2 L 14 2 L 14 5 L 11 5 Z" fill="#0284c7"/>
        <path d="M 2 22 Q 8 18 14 22 T 26 22" fill="none" stroke="#0284c7" stroke-width="3" stroke-linecap="round"/>
