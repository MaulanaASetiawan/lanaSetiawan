      <text x="196" y="318" fill="#64748b" font-size="12" font-weight="500">Pompa pH Down</text>
      <text x="196" y="342" fill="#0f172a" font-size="15" font-weight="800">0,00 Detik</text>

      <!-- Card 3: Pompa Air -->
