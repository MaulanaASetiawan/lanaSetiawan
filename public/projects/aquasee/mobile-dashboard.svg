      </g>
      <text x="36" y="126" fill="#ffffff" font-size="13" font-weight="600" opacity="0.95">pH Level</text>
      <text x="36" y="168" fill="#ffffff" font-size="36" font-weight="800">7,31</text>
      <text x="36" y="192" fill="#ffffff" font-size="13" font-weight="600" opacity="0.95">Netral</text>

      <!-- Water Drop PH Icon on Green Card -->
