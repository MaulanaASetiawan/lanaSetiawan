<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 750" width="1100" height="750" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090f1d"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#162036"/>
    </linearGradient>

    <!-- Phone 1 Cards Gradients -->
    <linearGradient id="greenCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#76c834"/>
      <stop offset="100%" stop-color="#4ea81f"/>
    </linearGradient>
    <linearGradient id="blueCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>

    <!-- Phone Mockup Frame Shadow -->
    <filter id="phoneShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#64748b" flood-opacity="0.12"/>
    </filter>
    <filter id="glowOrange" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glowPink" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="phoneClip">
      <rect width="360" height="680" rx="36"/>
    </clipPath>
  </defs>

  <!-- Canvas Background -->
  <rect width="1100" height="750" rx="16" fill="url(#bgGrad)" stroke="#334155" stroke-width="2"/>

  <!-- Top Title Banner -->
  <rect x="24" y="16" width="1052" height="54" rx="10" fill="#0b1324" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="44" y="42" fill="#38bdf8" font-size="16" font-weight="800" letter-spacing="1">📱 AQUASEE MOBILE APPLICATION (KOTLIN &amp; ANTARES IOT)</text>
  <text x="44" y="58" fill="#94a3b8" font-size="11.5">Antarmuka asli: Tab Overview (Sensor &amp; Status Aktuator Real-Time) dan Tab Grafik Parameter Air (1415 Data Telemetri)</text>

  <!-- ==================== PHONE 1: TAB OVERVIEW ==================== -->
  <g transform="translate(130, 84)" filter="url(#phoneShadow)">
    <!-- Outer Phone Body / Bezel -->
    <rect width="366" height="646" rx="38" fill="#1e293b" stroke="#475569" stroke-width="3"/>
    
    <!-- Screen Container (Clipped) -->
