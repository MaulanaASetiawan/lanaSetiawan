      <rect width="360" height="640" fill="#f8fafc"/>

      <!-- Android Status Bar -->
      <text x="22" y="22" fill="#1e293b" font-size="11" font-weight="700">20:23</text>
      <circle cx="62" cy="18" r="2.5" fill="#64748b"/>
      <path d="M 68 15 L 75 15 L 75 21 L 68 21 Z" fill="#64748b"/>
      <!-- Status Icons Right -->
      <path d="M 280 14 A 5 5 0 0 1 285 20 A 4 4 0 0 0 282 15 Z" fill="#64748b"/>
      <rect x="290" y="16" width="2" height="6" fill="#64748b"/>
      <rect x="294" y="14" width="2" height="8" fill="#64748b"/>
      <rect x="298" y="12" width="2" height="10" fill="#64748b"/>
      <rect x="302" y="10" width="2" height="12" fill="#64748b"/>
      <rect x="312" y="11" width="24" height="11" rx="3" fill="none" stroke="#64748b" stroke-width="1.2"/>
      <rect x="314" y="13" width="18" height="7" rx="1.5" fill="#22c55e"/>
      <text x="323" y="20" fill="#ffffff" font-size="7" font-weight="800" text-anchor="middle">97</text>

      <!-- Header -->
