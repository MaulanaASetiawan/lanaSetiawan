        <text x="14" y="24" fill="#64748b" font-size="9" text-anchor="end">80</text>
        <text x="14" y="44" fill="#64748b" font-size="9" text-anchor="end">60</text>
        <text x="14" y="64" fill="#64748b" font-size="9" text-anchor="end">40</text>
        <text x="14" y="84" fill="#64748b" font-size="9" text-anchor="end">20</text>
