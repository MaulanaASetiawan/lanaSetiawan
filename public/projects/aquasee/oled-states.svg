<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 660" width="1100" height="660" font-family="'Courier New', 'Consolas', 'JetBrains Mono', monospace">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070c18"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <!-- OLED Bezel -->
    <linearGradient id="bezelGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <!-- OLED Screen Interior -->
    <radialGradient id="screenGlow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#001424"/>
      <stop offset="100%" stop-color="#00070d"/>
    </radialGradient>
    <!-- Pixel Bloom Filter -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="1100" height="660" rx="16" fill="url(#bgGrad)" stroke="#334155" stroke-width="2"/>

  <!-- Main Title Banner -->
  <rect x="24" y="20" width="1052" height="64" rx="10" fill="#0b1324" stroke="#00e5ff" stroke-width="1.5"/>
  <text x="44" y="47" fill="#00e5ff" font-size="18" font-weight="bold" letter-spacing="1">🖥️ AQUASEE — OLED SSD1306 (128×64) DISPLAY TELEMETRY STATES</text>
  <text x="44" y="69" fill="#94a3b8" font-size="12">Visualisasi antarmuka real-time hasil render firmware C++ (Adafruit_SSD1306 &amp; Org_01 font) pada ESP32</text>

  <!-- ==================== SCREEN 1: MONITORING NORMAL ==================== -->
  <g transform="translate(40, 105)">
    <!-- Hardware Bezel -->
    <rect width="480" height="248" rx="12" fill="url(#bezelGrad)" stroke="#334155" stroke-width="2"/>
    <text x="16" y="-8" fill="#38bdf8" font-size="13" font-weight="bold">1. STATE MONITORING REAL-TIME (NORMAL)</text>

    <!-- Glass Display (Aspect ratio 128:64 scaled x3.5 -> 448x224) -->
    <g transform="translate(16, 12)">
      <rect width="448" height="224" rx="4" fill="url(#screenGlow)" stroke="#00384d" stroke-width="2"/>

      <!-- Outer Frame (0,0,127,64) -->
      <rect x="4" y="4" width="440" height="216" fill="none" stroke="#00e5ff" stroke-width="2.5" filter="url(#cyanGlow)"/>

      <!-- Header: AQUASEE (2,2,123,13) -->
      <rect x="11" y="11" width="426" height="42" fill="#00e5ff" filter="url(#cyanGlow)"/>
      <text x="224" y="38" fill="#00070d" font-size="20" font-weight="900" text-anchor="middle" letter-spacing="3">AQUASEE</text>

      <!-- 3 Sensor Boxes (y=16..45 -> scale: y=56..154) -->
      <!-- Box 1: PH (x=2..42 -> scale: x=11..151, w=140) -->
      <rect x="11" y="56" width="138" height="98" fill="none" stroke="#00e5ff" stroke-width="2"/>
      <text x="80" y="90" fill="#00e5ff" font-size="16" font-weight="bold" text-anchor="middle">PH</text>
      <text x="80" y="132" fill="#00e5ff" font-size="22" font-weight="bold" text-anchor="middle" filter="url(#cyanGlow)">7.24</text>

      <!-- Box 2: TEMP (x=43..84 -> scale: x=154..294, w=140) -->
      <rect x="154" y="56" width="140" height="98" fill="none" stroke="#00e5ff" stroke-width="2"/>
      <text x="224" y="90" fill="#00e5ff" font-size="16" font-weight="bold" text-anchor="middle">TEMP</text>
      <text x="224" y="132" fill="#00e5ff" font-size="22" font-weight="bold" text-anchor="middle" filter="url(#cyanGlow)">27.8</text>

      <!-- Box 3: NTU (x=85..125 -> scale: x=299..437, w=138) -->
      <rect x="299" y="56" width="138" height="98" fill="none" stroke="#00e5ff" stroke-width="2"/>
      <text x="368" y="90" fill="#00e5ff" font-size="16" font-weight="bold" text-anchor="middle">NTU</text>
      <text x="368" y="132" fill="#00e5ff" font-size="22" font-weight="bold" text-anchor="middle" filter="url(#cyanGlow)">4.2</text>

      <!-- Bottom Status Bar (2,46,123,16 -> scale: y=158..212) -->
      <rect x="11" y="158" width="426" height="54" fill="none" stroke="#00e5ff" stroke-width="2"/>
      <text x="24" y="192" fill="#00e5ff" font-size="15" font-weight="bold">STATUS:</text>
      <text x="140" y="192" fill="#00e5ff" font-size="15" font-weight="bold" filter="url(#cyanGlow)">Fuzzy Calc...</text>
    </g>
  </g>

  <!-- ==================== SCREEN 2: STATE ACTUATING ==================== -->
  <g transform="translate(580, 105)">
    <!-- Hardware Bezel -->
    <rect width="480" height="248" rx="12" fill="url(#bezelGrad)" stroke="#334155" stroke-width="2"/>
    <text x="16" y="-8" fill="#22c55e" font-size="13" font-weight="bold">2. STATE ACTUATING (FUZZY SUGENO AKTIF)</text>

    <!-- Glass Display -->
    <g transform="translate(16, 12)">
      <rect width="448" height="224" rx="4" fill="url(#screenGlow)" stroke="#00384d" stroke-width="2"/>

      <!-- Outer Frame -->
      <rect x="4" y="4" width="440" height="216" fill="none" stroke="#00e5ff" stroke-width="2.5" filter="url(#cyanGlow)"/>

      <!-- Header: AQUASEE -->
      <rect x="11" y="11" width="426" height="42" fill="#00e5ff" filter="url(#cyanGlow)"/>
      <text x="224" y="38" fill="#00070d" font-size="20" font-weight="900" text-anchor="middle" letter-spacing="3">AQUASEE</text>

      <!-- 3 Sensor Boxes: pH turun ke 5.80 (Asam), NTU 12.5 (Keruh) -->
      <rect x="11" y="56" width="138" height="98" fill="none" stroke="#00e5ff" stroke-width="2"/>
      <text x="80" y="90" fill="#00e5ff" font-size="16" font-weight="bold" text-anchor="middle">PH</text>
      <text x="80" y="132" fill="#00e5ff" font-size="22" font-weight="bold" text-anchor="middle" filter="url(#cyanGlow)">5.80</text>

      <rect x="154" y="56" width="140" height="98" fill="none" stroke="#00e5ff" stroke-width="2"/>
      <text x="224" y="90" fill="#00e5ff" font-size="16" font-weight="bold" text-anchor="middle">TEMP</text>
      <text x="224" y="132" fill="#00e5ff" font-size="22" font-weight="bold" text-anchor="middle" filter="url(#cyanGlow)">24.2</text>

      <rect x="299" y="56" width="138" height="98" fill="none" stroke="#00e5ff" stroke-width="2"/>
      <text x="368" y="90" fill="#00e5ff" font-size="16" font-weight="bold" text-anchor="middle">NTU</text>
      <text x="368" y="132" fill="#00e5ff" font-size="22" font-weight="bold" text-anchor="middle" filter="url(#cyanGlow)">12.5</text>

      <!-- Bottom Status Bar: Relay Air & pH UP & Heater Aktif! -->
      <rect x="11" y="158" width="426" height="54" fill="none" stroke="#00e5ff" stroke-width="2"/>
      <text x="24" y="192" fill="#00e5ff" font-size="15" font-weight="bold">STATUS:</text>
      <text x="140" y="192" fill="#22c55e" font-size="15" font-weight="bold" filter="url(#cyanGlow)">WTR-UP-HEAT</text>
    </g>
  </g>

  <!-- ==================== SCREEN 3: PRIMING PUMP ==================== -->
  <g transform="translate(40, 395)">
    <!-- Hardware Bezel -->
    <rect width="480" height="248" rx="12" fill="url(#bezelGrad)" stroke="#334155" stroke-width="2"/>
    <text x="16" y="-8" fill="#f59e0b" font-size="13" font-weight="bold">3. PRIMING PUMP (KALIBRASI SELANG DOSING)</text>

    <!-- Glass Display -->
    <g transform="translate(16, 12)">
      <rect width="448" height="224" rx="4" fill="url(#screenGlow)" stroke="#00384d" stroke-width="2"/>

      <!-- Outer Frame -->
      <rect x="4" y="4" width="440" height="216" fill="none" stroke="#00e5ff" stroke-width="2.5" filter="url(#cyanGlow)"/>

      <!-- Header: PRIMING PUMP (2,2,123,13) -->
      <rect x="11" y="11" width="426" height="42" fill="#00e5ff" filter="url(#cyanGlow)"/>
      <text x="224" y="38" fill="#00070d" font-size="18" font-weight="900" text-anchor="middle" letter-spacing="2">PRIMING PUMP</text>

      <!-- Middle Box: Status Pompa pH (2,16,123,23) -->
      <rect x="11" y="58" width="426" height="78" fill="none" stroke="#00e5ff" stroke-width="2"/>
      <text x="40" y="88" fill="#00e5ff" font-size="15" font-weight="bold">PH UP   :</text>
      <text x="180" y="88" fill="#22c55e" font-size="15" font-weight="bold" filter="url(#cyanGlow)">RUNNING</text>

      <text x="40" y="118" fill="#00e5ff" font-size="15" font-weight="bold">PH DOWN :</text>
      <text x="180" y="118" fill="#00e5ff" font-size="15" font-weight="bold">RUNNING</text>

      <!-- Bottom Box: Countdown Waktu (2,40,123,22) -->
      <rect x="11" y="142" width="426" height="70" fill="none" stroke="#00e5ff" stroke-width="2"/>
      <text x="150" y="188" fill="#00e5ff" font-size="28" font-weight="900" filter="url(#cyanGlow)">3.45</text>
      <text x="260" y="188" fill="#00e5ff" font-size="22" font-weight="bold">SEC</text>
    </g>
  </g>

  <!-- ==================== SCREEN 4: BOOT & EEPROM SAFEGUARD ==================== -->
  <g transform="translate(580, 395)">
    <!-- Hardware Bezel -->
    <rect width="480" height="248" rx="12" fill="url(#bezelGrad)" stroke="#334155" stroke-width="2"/>
    <text x="16" y="-8" fill="#a855f7" font-size="13" font-weight="bold">4. REBOOT &amp; EEPROM POWER-LOSS SAFEGUARD</text>

    <!-- Glass Display -->
    <g transform="translate(16, 12)">
      <rect width="448" height="224" rx="4" fill="url(#screenGlow)" stroke="#00384d" stroke-width="2"/>

      <!-- Outer Frame -->
      <rect x="4" y="4" width="440" height="216" fill="none" stroke="#00e5ff" stroke-width="2.5" filter="url(#cyanGlow)"/>

      <!-- Header: SKIP PRIMING -->
      <rect x="11" y="11" width="426" height="42" fill="#00e5ff" filter="url(#cyanGlow)"/>
      <text x="224" y="38" fill="#00070d" font-size="17" font-weight="900" text-anchor="middle" letter-spacing="2">=== SKIP PRIMING ===</text>

      <!-- Text Content: Power outage detection -->
      <rect x="11" y="58" width="426" height="154" fill="none" stroke="#00e5ff" stroke-width="2"/>
      <text x="30" y="92" fill="#fbbf24" font-size="14" font-weight="bold">⚡ Reboot mati listrik terdeteksi!</text>
      <text x="30" y="122" fill="#00e5ff" font-size="13">• Flag 0xAB ditemukan pada EEPROM addr 33</text>
      <text x="30" y="148" fill="#00e5ff" font-size="13">• Cairan masih terisi di selang peristaltik</text>
      <text x="30" y="174" fill="#a855f7" font-size="13" font-weight="bold">• Priming di-skip otomatis (Cegah Overdosis)</text>
      <text x="30" y="198" fill="#22c55e" font-size="13" font-weight="bold">▶ Starting main loop...</text>
    </g>
  </g>
</svg>
