<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" width="900" height="450">
  <rect width="900" height="450" fill="#0d1117"/>
  <rect x="14" y="14" width="872" height="422" fill="#161b22" stroke="#f97316" stroke-width="4"/>
  <text x="40" y="52" fill="#f97316" font-family="monospace" font-weight="bold" font-size="20">CARA KERJA ARSITEKTUR HYBRID PDFKu (LOCAL BROWSER + CLOUD API)</text>

  <!-- User Browser Box -->
  <rect x="40" y="88" width="380" height="310" fill="#1c2333" stroke="#22c55e" stroke-width="3"/>
  <text x="60" y="120" fill="#22c55e" font-family="monospace" font-weight="bold" font-size="16">JALUR 1: PEMROSESAN LOKAL (DI BROWSER)</text>
  <text x="60" y="152" fill="#e6edf3" font-family="monospace" font-size="13">Digunakan untuk: Merge, Split, Susun Halaman</text>
  <rect x="60" y="172" width="340" height="90" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
  <text x="76" y="200" fill="#38bdf8" font-family="monospace" font-size="13">1. File dibaca ke ArrayBuffer (Memory)</text>
  <text x="76" y="222" fill="#38bdf8" font-family="monospace" font-size="13">2. Render thumbnail dengan PDF.js</text>
  <text x="76" y="244" fill="#38bdf8" font-family="monospace" font-size="13">3. Manipulasi langsung via PDF-lib</text>
  <text x="60" y="298" fill="#22c55e" font-family="monospace" font-weight="bold" font-size="13">Keunggulan:</text>
  <text x="60" y="320" fill="#94a3b8" font-family="monospace" font-size="12">• 0 Byte kuota internet terpakai untuk upload</text>
  <text x="60" y="342" fill="#94a3b8" font-family="monospace" font-size="12">• Eksekusi instan di perangkat pengguna</text>

  <!-- Cloud Microservice Box -->
  <rect x="470" y="88" width="390" height="310" fill="#1c2333" stroke="#38bdf8" stroke-width="3"/>
  <text x="490" y="120" fill="#38bdf8" font-family="monospace" font-weight="bold" font-size="16">JALUR 2: KONVERSI &amp; KOMPRESI (CLOUD)</text>
  <text x="490" y="152" fill="#e6edf3" font-family="monospace" font-size="13">Digunakan untuk: PDF to DOCX &amp; Ghostscript</text>
  <rect x="490" y="172" width="350" height="90" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
  <text x="506" y="200" fill="#f97316" font-family="monospace" font-size="13">1. Upload aman via Express.js &amp; Multer</text>
  <text x="506" y="222" fill="#f97316" font-family="monospace" font-size="13">2. Konversi oleh pdf2docx / PyMuPDF</text>
  <text x="506" y="244" fill="#f97316" font-family="monospace" font-size="13">3. File sementara dihapus otomatis</text>
  <text x="490" y="298" fill="#38bdf8" font-family="monospace" font-weight="bold" font-size="13">Infrastruktur:</text>
  <text x="490" y="320" fill="#94a3b8" font-family="monospace" font-size="12">• Frontend di Vercel (pdf-ku.vercel.app)</text>
  <text x="490" y="342" fill="#94a3b8" font-family="monospace" font-size="12">• Backend Docker di HuggingFace Spaces</text>
</svg>
