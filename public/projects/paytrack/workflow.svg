<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" width="900" height="450">
  <rect width="900" height="450" fill="#0d1117"/>
  <rect x="14" y="14" width="872" height="422" fill="#161b22" stroke="#22c55e" stroke-width="4"/>
  <text x="38" y="52" fill="#22c55e" font-family="monospace" font-weight="bold" font-size="20">CARA KERJA PAYTRACK: STRICT WALLET ACCOUNTABILITY &amp; SUPABASE RLS</text>

  <!-- Step 1 -->
  <rect x="38" y="95" width="195" height="210" fill="#1c2333" stroke="#38bdf8" stroke-width="3"/>
  <text x="54" y="128" fill="#38bdf8" font-family="monospace" font-weight="bold" font-size="14">1. AUTH &amp; RLS</text>
  <text x="54" y="158" fill="#e6edf3" font-family="monospace" font-size="12">• Modal Auth</text>
  <text x="54" y="178" fill="#e6edf3" font-family="monospace" font-size="12">  (Supabase Auth)</text>
  <text x="54" y="206" fill="#e6edf3" font-family="monospace" font-size="12">• Isolasi data</text>
  <text x="54" y="226" fill="#e6edf3" font-family="monospace" font-size="12">  tiap user dengan</text>
  <text x="54" y="246" fill="#22c55e" font-family="monospace" font-size="12">  PostgreSQL RLS</text>

  <!-- Step 2 -->
  <rect x="253" y="95" width="195" height="210" fill="#1c2333" stroke="#f97316" stroke-width="3"/>
  <text x="269" y="128" fill="#f97316" font-family="monospace" font-weight="bold" font-size="14">2. STRICT BALANCE</text>
  <text x="269" y="158" fill="#e6edf3" font-family="monospace" font-size="12">• Saldo Utama =</text>
  <text x="269" y="178" fill="#e6edf3" font-family="monospace" font-size="12">  Top-up - Expense</text>
  <text x="269" y="198" fill="#e6edf3" font-family="monospace" font-size="12">  - Deposit Tabungan</text>
  <text x="269" y="228" fill="#f97316" font-family="monospace" font-size="12">• Cegah saldo</text>
  <text x="269" y="248" fill="#f97316" font-family="monospace" font-size="12">  negatif ("Ghost</text>
  <text x="269" y="268" fill="#f97316" font-family="monospace" font-size="12">  Money")</text>

  <!-- Step 3 -->
  <rect x="468" y="95" width="195" height="210" fill="#1c2333" stroke="#22c55e" stroke-width="3"/>
  <text x="484" y="128" fill="#22c55e" font-family="monospace" font-weight="bold" font-size="14">3. TARGET SAVINGS</text>
  <text x="484" y="158" fill="#e6edf3" font-family="monospace" font-size="12">• Alokasi dana</text>
  <text x="484" y="178" fill="#e6edf3" font-family="monospace" font-size="12">  memotong saldo</text>
  <text x="484" y="198" fill="#e6edf3" font-family="monospace" font-size="12">  dompet nyata</text>
  <text x="484" y="228" fill="#22c55e" font-family="monospace" font-size="12">• Auto-Lock saat</text>
  <text x="484" y="248" fill="#22c55e" font-family="monospace" font-size="12">  target 100%</text>
  <text x="484" y="268" fill="#22c55e" font-family="monospace" font-size="12">  tercapai</text>

  <!-- Step 4 -->
  <rect x="683" y="95" width="179" height="210" fill="#1c2333" stroke="#a78bfa" stroke-width="3"/>
  <text x="699" y="128" fill="#a78bfa" font-family="monospace" font-weight="bold" font-size="14">4. ANALYTICS</text>
  <text x="699" y="158" fill="#e6edf3" font-family="monospace" font-size="12">• Visualisasi</text>
  <text x="699" y="178" fill="#e6edf3" font-family="monospace" font-size="12">  Recharts</text>
  <text x="699" y="206" fill="#e6edf3" font-family="monospace" font-size="12">• Pelacakan</text>
  <text x="699" y="226" fill="#e6edf3" font-family="monospace" font-size="12">  Subscription</text>
  <text x="699" y="254" fill="#38bdf8" font-family="monospace" font-size="12">• PWA Ready</text>

  <rect x="38" y="330" width="824" height="80" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
  <text x="58" y="362" fill="#e6edf3" font-family="monospace" font-size="14">Dibangun dengan Next.js 15 (App Router &amp; Server Actions), TypeScript, Tailwind CSS, Supabase PostgreSQL,</text>
  <text x="58" y="386" fill="#22c55e" font-family="monospace" font-size="14">dan @serwist/next untuk dukungan Progressive Web App (PWA).</text>
</svg>
